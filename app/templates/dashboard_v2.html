<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feedboard — Dashboard V2</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard_v2.css') }}">
</head>
<body>
  <header class="v2-toolbar">
    <div class="toolbar-left">
      <span class="live-dot"></span>
      <h1>Dashboard V2</h1>
    </div>
    <div class="toolbar-center"></div>
    <div class="toolbar-right">
       <button class="btn" id="addWidgetBtn" aria-label="Add Widget" title="Add Widget">
         <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
           <line x1="12" y1="5" x2="12" y2="19"></line>
           <line x1="5" y1="12" x2="19" y2="12"></line>
         </svg>
         Add Widget
       </button>
       <button class="btn" id="saveLayoutBtn" aria-label="Save Layout" title="Save Layout">
         <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
           <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
           <polyline points="7 10 12 15 17 10"></polyline>
           <line x1="12" y1="15" x2="12" y2="3"></line>
         </svg>
         Save Layout
       </button>
       <button class="btn" id="loadLayoutBtn" aria-label="Load Layout" title="Load Layout">
         <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
           <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
           <polyline points="17 10 12 15 7 10"></polyline>
           <line x1="12" y1="15" x2="12" y2="3"></line>
         </svg>
         Load Layout
       </button>
      <button class="btn" id="globalSettingsBtn" aria-label="Settings" title="Settings">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l-.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
      <a href="/" class="btn" aria-label="Back to Landing" title="Back to Landing">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
      </a>
    </div>
  </header>

  <main class="v2-main">
    <div class="css-grid" id="grid"></div>
  </main>

  <!-- Widget Settings Modal -->
  <div class="modal-overlay" id="widgetSettingsModal">
    <div class="modal">
      <h2 class="modal-title">Widget Settings</h2>
      <form class="settings-form"></form>
      <div class="modal-actions">
        <button type="button" class="btn close-settings-btn" aria-label="Cancel">Cancel</button>
        <button type="button" class="btn delete-widget-btn" style="background: var(--accent); color: #fff; margin-right: auto;" aria-label="Delete Widget">Delete Widget</button>
        <button type="button" class="btn save-settings-btn" style="background: var(--accent); color: #fff;" aria-label="Save">Save</button>
      </div>
    </div>
  </div>

  <!-- Widget Picker Modal -->
  <div class="modal-overlay" id="widgetPickerModal">
    <div class="modal" style="max-width: 600px;">
      <h2>Add Widget</h2>
      <div class="widget-picker-grid"></div>
      <div class="modal-actions">
        <button type="button" class="btn close-settings-btn" aria-label="Cancel">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Layout Modal -->
  <div class="modal-overlay" id="layoutModal">
    <div class="modal" style="max-width: 480px;">
      <h2>Layout Manager</h2>
      <div style="margin-bottom: 1.25rem;">
        <h3 style="font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 0.75rem; font-weight: 700;">Save Current Layout</h3>
        <button type="button" class="btn" id="downloadLayoutBtn" style="background: var(--accent); color: #fff; width: 100%; justify-content: center;">Download Layout as JSON</button>
      </div>
      <hr style="border-color: var(--border); margin: 1rem 0;">
      <div>
        <h3 style="font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 0.75rem; font-weight: 700;">Load Layout</h3>
        <div class="form-group">
          <label for="loadLayoutInput">Select Layout File</label>
          <input type="file" id="loadLayoutInput" accept=".json" style="padding: 0.5rem; background: var(--bg); border: 1px solid var(--border); color: var(--text); border-radius: 4px; width: 100%;">
        </div>
        <button type="button" class="btn" id="uploadLayoutBtn" style="background: var(--accent); color: #fff; width: 100%; justify-content: center;">Upload & Apply Layout</button>
      </div>
      <div class="modal-actions" style="margin-top: 1.25rem; justify-content: flex-end;">
        <button type="button" class="btn close-layout-btn">Close</button>
      </div>
    </div>
  </div>

  <!-- Global Settings Modal -->
  <div class="modal-overlay" id="globalSettingsModal">
    <div class="modal">
      <h2>Global Settings</h2>
      <div class="form-group">
        <label for="finnhubApiKey">Finnhub API Key</label>
        <input type="text" id="finnhubApiKey" placeholder="Enter your Finnhub API key" autocomplete="off">
        <p class="field-help">Required for Stock Prices widget. Get a free key at <a href="https://finnhub.io" target="_blank">finnhub.io</a></p>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn close-settings-btn" aria-label="Cancel">Cancel</button>
        <button type="button" class="btn save-settings-btn" style="background: var(--accent); color: #fff;" aria-label="Save">Save</button>
      </div>
    </div>
  </div>

  {% if rss2json_api_key %}
  <script>window.RSS2JSON_API_KEY = {{ rss2json_api_key | tojson }};</script>
  {% endif %}
  <script type="module" src="{{ url_for('static', filename='js/dashboard_v2/index.js') }}"></script>
</body>
</html>
