<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Life Dashboard</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
  <!-- Unified Top Bar -->
  <header class="topbar" id="statusBar">
    <div class="brand">
      <span class="live-dot"></span> News
    </div>

    <div class="status-time" id="statusTime">
      <span class="time-main" id="timeMain">--:--</span>
      <span class="time-sub" id="timeSub"></span>
    </div>

    <div class="status-weather" id="statusWeather">
      <span class="weather-icon" id="weatherIcon">⛅</span>
      <span class="weather-temp" id="weatherTemp">--°</span>
      <span class="weather-desc" id="weatherDesc">—</span>
    </div>

    <button class="btn" id="openSettingsBtn" aria-label="Settings" title="Settings">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
    </button>
  </header>

  <main>
    <div class="article-card" id="articleCard">
      <div class="image-container" id="imageContainer">
        <img id="articleImg" src="" alt="Article image">
      </div>
      <div class="content-container">
        <div class="meta">
          <span class="tag" id="articleSource">Source</span>
          <span class="pub-date" id="articleDate">Date</span>
        </div>
        <h1 class="headline" id="articleTitle">Loading feed content...</h1>
        <p class="snippet" id="articleSnippet"></p>
        <a href="#" target="_blank" class="read-more" id="articleLink">
          Read original article ↗
        </a>
      </div>
    </div>
  </main>

  <footer>
    <div class="counter" id="articleCounter">0 / 0</div>
    <div class="nav-controls">
      <button class="btn" id="prevBtn" aria-label="Previous article" title="Previous">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="15" y1="18" x2="9" y2="12"></line>
          <line x1="15" y1="6" x2="9" y2="12"></line>
        </svg>
      </button>
      <button class="btn" id="pauseBtn" aria-label="Pause" title="Pause">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="6" y="4" width="4" height="16"></rect>
          <rect x="14" y="4" width="4" height="16"></rect>
        </svg>
      </button>
      <button class="btn" id="nextBtn" aria-label="Next article" title="Next">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="9" y1="6" x2="15" y2="12"></line>
          <line x1="9" y1="18" x2="15" y2="12"></line>
        </svg>
      </button>
    </div>
  </footer>

  <div class="progress-bar-container">
    <div class="progress-bar" id="progressBar"></div>
  </div>

  <!-- Settings Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <h2>Display Settings</h2>

      <div class="tabs" id="settingsTabs">
        <button class="tab-btn active" data-tab="general">General</button>
        <button class="tab-btn" data-tab="location">Location &amp; Time</button>
        <button class="tab-btn" data-tab="data">Import / Export</button>
      </div>

      <!-- General Tab -->
      <div class="tab-panel active" data-panel="general">
        <div class="form-group">
          <label>Built-in News Topics</label>
          <div class="topic-list" id="topicList">
            <label class="topic-item">
              <input type="checkbox" name="topic" value="WORLD">
              <span>World News</span>
            </label>
            <label class="topic-item">
              <input type="checkbox" name="topic" value="TECHNOLOGY">
              <span>Technology</span>
            </label>
            <label class="topic-item">
              <input type="checkbox" name="topic" value="BUSINESS">
              <span>Business</span>
            </label>
            <label class="topic-item">
              <input type="checkbox" name="topic" value="SCIENCE">
              <span>Science</span>
            </label>
            <label class="topic-item">
              <input type="checkbox" name="topic" value="SPORTS">
              <span>Sports</span>
            </label>
          </div>
        </div>

        <div class="form-group">
          <label>Custom RSS Feeds</label>
          <div class="custom-feed-list" id="customFeedList"></div>
          <button class="btn add-feed-btn" id="addFeedBtn" type="button" aria-label="Add custom feed" title="Add Custom Feed">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
          </button>
        </div>

        <div class="form-group">
          <label for="slideIntervalInput">Article Rotation Speed (seconds)</label>
          <input type="number" id="slideIntervalInput" min="3" max="60" value="8">
        </div>

        <div class="modal-actions">
          <button class="btn" id="closeSettingsBtn" aria-label="Cancel" title="Cancel">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
          <button class="btn" id="saveSettingsBtn" style="background: var(--accent); color: #0f172a;" aria-label="Save changes" title="Save Changes">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
          </button>
        </div>
      </div>

      <!-- Location & Time Tab -->
      <div class="tab-panel" data-panel="location">
        <p class="tab-hint">Select a timezone for the clock. Optionally set a location to display live weather.</p>

        <div class="form-group">
          <label for="timezoneSelect">Timezone</label>
          <select id="timezoneSelect"></select>
        </div>

        <div class="form-group">
          <label for="locationInput">Location (city name)</label>
          <input type="text" id="locationInput" placeholder="e.g. London, New York, Tokyo" autocomplete="off">
          <p class="field-help" id="locationHelp"></p>
        </div>

        <div class="form-group">
          <label for="weatherUnitSelect">Temperature Unit</label>
          <select id="weatherUnitSelect">
            <option value="celsius">Celsius (°C)</option>
            <option value="fahrenheit">Fahrenheit (°F)</option>
          </select>
        </div>
      </div>

      <!-- Import / Export Tab -->
      <div class="tab-panel" data-panel="data">
        <p class="tab-hint">Export your settings to migrate them to another machine, or import a previously saved file.</p>
        <div class="modal-actions">
          <button class="btn" id="exportSettingsBtn" style="background: var(--accent); color: #0f172a;" aria-label="Download settings" title="Download Settings">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="7 10 12 15 17 10"></polyline>
              <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
          </button>
          <button class="btn" id="importSettingsBtn" aria-label="Import settings" title="Import Settings">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 9v4a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V9"></path>
              <polyline points="17 11 12 6 7 11"></polyline>
              <line x1="12" y1="9" x2="12" y2="21"></line>
            </svg>
          </button>
          <input type="file" id="importFileInput" accept="application/json" hidden>
        </div>
        <p class="import-status" id="importStatus"></p>
      </div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/config.js') }}"></script>
  <script src="{{ url_for('static', filename='js/db.js') }}"></script>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
